<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Demo Shop - Wireless Earbuds</title>
    <meta name="product:price:amount" content="16.40" />
    <meta name="product:price:currency" content="SGD" />
  </head>
  <body>
    <h1 id="product-title">Wireless Earbuds Pro</h1>
    <p id="product-price">SGD 16.40</p>

    <form id="checkout-form">
      <label>Card number <input id="card-number" name="card_number" /></label>
      <label>Expiry <input id="card-expiry" name="card_expiry" /></label>
      <label>CVV <input id="card-cvv" name="card_cvv" /></label>
      <button type="submit" id="pay-button">Pay now</button>
    </form>

    <p id="receipt" style="display: none">
      Payment successful. Order #DEMO-0001
    </p>

    <script>
      document
        .getElementById("checkout-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          document.getElementById("receipt").style.display = "block";
        });
    </script>
  </body>
</html>
